name: Build site package

# Builds the static website + PHP backend and deploys it straight to
# public_html via FTP (no manual zip download/upload needed). Also runs on a
# schedule so admin-panel content additions go live automatically without
# anyone needing to trigger a rebuild by hand.
# Manual zip is still attached as an artifact as a fallback / for local testing.
on:
  push:
    branches: [master, "claude/**"]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

# Two overlapping FTP deploys race against the same server-side sync-state
# cache and can corrupt each other mid-sync (seen in practice: one run's
# cleanup step failed to find a directory the other run had already removed).
# Queue runs instead of letting them run in parallel.
concurrency:
  group: production-ftp-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: alibaba-site
          path: |
            dist/alibaba-site.zip
            dist/alibaba-config.sample.php
          retention-days: 30
      - name: Deploy to public_html via FTP
        if: ${{ vars.FTP_DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/public_html/
          server-dir: ./
          # .well-known holds AutoSSL/SSL domain-validation files the host manages;
          # config.php (if placed inside public_html) is left alone too; uploads/
          # holds images uploaded through the admin panel, which only ever exist
          # on the server, never in this build output - without excluding it the
          # default mirror-delete sync would wipe every uploaded image on each
          # scheduled deploy.
          exclude: |
            .well-known/**
            config.php
            uploads/**
      - name: Purge Cloudflare cache
        if: ${{ vars.FTP_DEPLOY_ENABLED == 'true' }}
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          else
            echo "Cloudflare purge skipped (CF_ZONE_ID / CF_API_TOKEN secrets not set)."
          fi
