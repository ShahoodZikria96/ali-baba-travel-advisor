services:
  mysql:
    image: mysql:8.4
    container_name: alibaba-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: alibaba_travel
      MYSQL_USER: alibaba
      MYSQL_PASSWORD: alibaba_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
